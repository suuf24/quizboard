<svg xmlns="http://www.w3.org/2000/svg" width="880" height="520" viewBox="0 0 880 520">
  <rect width="880" height="520" fill="#FFFFFF"/>

  <!-- Rongga dada: satu kotak besar, bukan gambar anatomi. -->
  <rect x="60" y="70" width="760" height="380" fill="none" stroke="#14181C" stroke-width="3"/>
  <text x="88" y="112" font-family="'Plus Jakarta Sans', sans-serif" font-size="26" font-weight="600" fill="#14181C">Rongga dada</text>

  <!-- Dua paru-paru, ukurannya sengaja berbeda supaya terlihat sebagai pasangan. -->
  <rect x="130" y="150" width="260" height="270" fill="none" stroke="#14181C" stroke-width="3"/>
  <text x="180" y="295" font-family="'Plus Jakarta Sans', sans-serif" font-size="30" font-weight="600" fill="#14181C">Paru-paru</text>
  <text x="216" y="332" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" fill="#5A6168">kiri</text>

  <rect x="430" y="170" width="300" height="230" fill="none" stroke="#14181C" stroke-width="3"/>
  <text x="490" y="295" font-family="'Plus Jakarta Sans', sans-serif" font-size="30" font-weight="600" fill="#14181C">Paru-paru</text>
  <text x="536" y="332" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" fill="#5A6168">kanan</text>

  <!-- Bagian yang ditunjuk: satu kantung kecil di dalam paru-paru kanan. -->
  <circle cx="580" cy="230" r="46" fill="none" stroke="#B4231C" stroke-width="4"/>
  <text x="556" y="240" font-family="'Plus Jakarta Sans', sans-serif" font-size="26" font-weight="700" fill="#B4231C">*</text>

  <!-- Anak panah dari luar kotak menuju kantung itu. -->
  <path d="M800 60 L604 190" fill="none" stroke="#B4231C" stroke-width="4"/>
  <path d="M604 190 L636 184 L620 158 Z" fill="#B4231C"/>
  <text x="686" y="46" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="600" fill="#B4231C">yang ditunjuk</text>
</svg>
